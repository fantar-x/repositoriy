<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Street Racer</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <!-- PixiJS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.3/pixi.min.js" defer></script>
  <script src="./app.js" type="module" defer></script>
  <link rel="manifest" href="data:application/manifest+json,{\n  \"name\": \"Street Racer\",\n  \"short_name\": \"Racer\",\n  \"display\": \"standalone\",\n  \"background_color\": \"#000000\",\n  \"theme_color\": \"#000000\"\n}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Street Racer">
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAQAAAB4pGw7AAAAJElEQVR42u3NMQEAAAwCoNm/9GgQwQAAAAAAAAAAAAAAAAAAAAAAAO8BnEAAASh6R1UAAAAASUVORK5CYII=">
</head>
<body>
  <div id="game-container" aria-label="Game canvas"></div>

  <div id="ui" class="overlay">
    <div class="center">
      <h1 class="logo" aria-label="Street Racer">Street Racer</h1>
      <button id="start-btn" class="btn primary" aria-label="Начать заезд">Начать заезд</button>
    </div>
  </div>

  <div id="car-select" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="car-select-title">
    <div class="car-select-wrap">
      <h2 id="car-select-title">Выбор машины</h2>
      <p class="subtitle">Фон чёрный, выберите автомобиль:</p>
      <div id="car-cards" class="cards"></div>
      <div class="actions">
        <button id="back-to-menu" class="btn ghost">Назад</button>
      </div>
    </div>
  </div>
</body>
</html>
